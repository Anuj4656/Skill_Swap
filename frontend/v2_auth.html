<!DOCTYPE html><html class="dark" lang="en" style=""><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0" name="viewport"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={"darkMode":"class","theme":{"extend":{"colors":{"badge-wanted-bg":"#1E232B","primary-fixed-dim":"#7ed6cb","error-container":"#93000a","secondary-fixed":"#dde3ec","on-tertiary-fixed-variant":"#72351d","surface-elevated":"#1F242B","secondary-fixed-dim":"#c1c7d0","inverse-on-surface":"#2f3034","badge-wanted-border":"#4B5563","on-primary-container":"#00302c","status-pending-bg":"#2A1E0D","surface-card":"#181B20","on-tertiary-container":"#4d1904","outline-variant":"#3e4947","error":"#ffb4ab","text-muted":"#8B949E","on-primary":"#003733","on-error-container":"#ffdad6","outline":"#889391","status-accepted-bg":"#0D2A20","text-secondary":"#C9D1D9","surface-dim":"#111316","on-primary-fixed-variant":"#00504a","on-secondary-fixed":"#161c23","surface-container-low":"#1a1c1f","on-secondary-container":"#b0b5be","on-background":"#e2e2e6","surface-container-highest":"#333538","primary-fixed":"#9bf2e7","surface-bright":"#37393d","surface-variant":"#333538","on-surface-variant":"#bdc9c6","border-strong":"#30363D","on-error":"#690005","status-completed-bg":"#12213D","status-rejected":"#E11D48","inverse-surface":"#e2e2e6","border-subtle":"#2D333B","background":"#111316","on-primary-fixed":"#00201d","tertiary":"#ffb59b","on-tertiary":"#562009","surface":"#111316","text-primary":"#E6EDF3","tertiary-container":"#cc7c5f","surface-container-high":"#282a2d","on-tertiary-fixed":"#380d00","surface-container-lowest":"#0c0e11","surface-tint":"#7ed6cb","on-surface":"#e2e2e6","status-completed":"#3B82F6","status-accepted":"#10B981","inverse-primary":"#006a62","surface-base":"#121417","status-rejected-bg":"#2F1119","secondary":"#c1c7d0","on-secondary":"#2b3138","surface-container":"#1e2023","secondary-container":"#41474f","primary":"#7ed6cb","primary-container":"#459f95","tertiary-fixed-dim":"#ffb59b","on-secondary-fixed-variant":"#41474f","tertiary-fixed":"#ffdbcf","status-pending":"#D97706"},"borderRadius":{"DEFAULT":"0.125rem","lg":"0.25rem","xl":"0.5rem","full":"0.75rem"},"spacing":{"space-xl":"2rem","gutter":"1.25rem","gutter-mobile":"0.75rem","margin-mobile":"1rem","space-sm":"0.5rem","space-md":"1rem","margin":"2rem","space-lg":"1.5rem","space-xs":"0.25rem"},"fontFamily":{"label-md":["Manrope"],"headline-md":["Manrope"],"title-md":["Manrope"],"body-lg":["Manrope"],"caption":["Manrope"],"headline-xl":["Manrope"],"headline-lg":["Manrope"],"body-md":["Manrope"],"label-sm":["Manrope"]},"fontSize":{"label-md":["13px",{"lineHeight":"18px","fontWeight":"600"}],"headline-md":["20px",{"lineHeight":"28px","fontWeight":"600"}],"title-md":["16px",{"lineHeight":"24px","fontWeight":"600"}],"body-lg":["16px",{"lineHeight":"24px","fontWeight":"400"}],"caption":["11px",{"lineHeight":"14px","fontWeight":"400"}],"headline-xl":["32px",{"lineHeight":"40px","fontWeight":"600"}],"headline-lg":["24px",{"lineHeight":"32px","fontWeight":"600"}],"body-md":["14px",{"lineHeight":"20px","fontWeight":"400"}],"label-sm":["12px",{"lineHeight":"16px","fontWeight":"600"}]}}}};</script></head><body class="bg-surface-base font-body-md text-text-primary min-h-screen flex items-center justify-center"><main class="w-full"><div class="flex flex-col w-full items-center justify-center py-space-xl px-margin-mobile md:px-margin">
<div class="w-full max-w-[480px] bg-surface-card rounded-xl p-space-md sm:p-space-lg shadow-xl relative overflow-hidden">
<div class="absolute -top-24 -right-24 w-48 h-48 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-20 -left-20 w-48 h-48 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
<div class="flex flex-col items-center text-center mb-space-lg relative z-10">
<div class="w-12 h-12 rounded-lg bg-surface-elevated flex items-center justify-center p-2 mb-space-sm shadow-sm">
<img alt="Skill Swap Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1XAXuyozRnk2Os9KtnusOxzt1cPCQcK6fRnB61HaS2qcjJ5PLbXUDPNDjeTVaM0K3py9o6JHtF_JO7xOHkjKnDDA_QNJk2rbiheg0pqhWIFImLXhcYTipuQJS_sGb0GSpNfJAkku7naH1tQp87cyTjkYU_yqlBt4sQMfIodL261L9PQBHcRLrv8GO0C2xnK8Od14_Y-_ZeI7to1qacdhbaPl7U73hBPuVgNtHIFNoOxtfV7kMwc01WcWzOr">
</div>
<h1 class="font-headline-lg text-headline-lg text-text-primary tracking-tight">Skill Swap</h1>

</div>
<div class="grid grid-cols-2 p-1 bg-surface-base rounded-lg mb-space-lg relative z-10">
<button class="py-2 text-center rounded-lg font-label-md text-label-md transition-all text-text-muted hover:text-text-secondary" id="tab-signin" onclick="setMode('signin')" type="button">
        Sign In
      </button>
<button class="py-2 text-center rounded-lg font-label-md text-label-md transition-all bg-surface-elevated text-text-primary shadow-sm" id="tab-register" onclick="setMode('register')" type="button">
        Register
      </button>
</div>
<form class="space-y-space-md relative z-10" id="auth-form" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-1.5 transition-all duration-200" id="field-name">
<label class="font-label-sm text-label-sm text-text-secondary" for="full-name">Full Name</label>
<div class="relative">
<input class="w-full h-[38px] px-3 bg-surface-base rounded-lg text-text-primary placeholder:text-text-muted font-body-md text-body-md transition-colors focus:outline-none focus:bg-surface-elevated" id="full-name" placeholder="Elena Vance" type="text">
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-text-secondary" for="email">Email Address</label>
<div class="relative">
<input class="w-full h-[38px] px-3 bg-surface-base rounded-lg text-text-primary placeholder:text-text-muted font-body-md text-body-md transition-colors focus:outline-none focus:bg-surface-elevated" id="email" placeholder="elena.vance@example.edu" required="" type="email">
</div>
</div>
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-sm text-label-sm text-text-secondary" for="password">Password</label>
<button class="hidden font-caption text-caption text-text-muted hover:text-primary transition-colors" id="forgot-password-link" type="button">
            Forgot password?
          </button>
</div>
<div class="relative flex items-center">
<input class="w-full h-[38px] pl-3 pr-10 bg-surface-base rounded-lg text-text-primary placeholder:text-text-muted font-body-md text-body-md transition-colors focus:outline-none focus:bg-surface-elevated" id="password" placeholder="••••••••••••" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-2.5 p-1 text-text-muted hover:text-text-primary focus:outline-none transition-colors" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[18px]" id="password-toggle-icon">visibility</span>
</button>
</div>
</div>
<div class="flex flex-col gap-2 pt-1" id="field-availability">
<span class="font-label-sm text-label-sm text-text-secondary">Availability</span>
<div class="grid grid-cols-3 gap-2">
<button class="availability-pill py-2 px-2.5 rounded-lg font-label-sm text-label-sm text-center transition-all bg-surface-base text-text-secondary hover:bg-surface-elevated hover:text-text-primary" onclick="togglePill(this)" type="button">
            Weekends
          </button>
<button class="availability-pill py-2 px-2.5 rounded-lg font-label-sm text-label-sm text-center transition-all bg-surface-base text-text-secondary hover:bg-surface-elevated hover:text-text-primary" onclick="togglePill(this)" type="button">
            Evenings
          </button>
<button class="availability-pill active py-2 px-2.5 rounded-lg font-label-sm text-label-sm text-center transition-all bg-badge-wanted-bg text-primary-fixed-dim" onclick="togglePill(this)" type="button">
            Flexible
          </button>
</div>
</div>
<div class="pt-1" id="field-checkbox">
<label class="flex items-start gap-2.5 cursor-pointer select-none">
<input checked="" class="mt-1 w-4 h-4 rounded bg-surface-base text-primary-container focus:ring-0 focus:ring-offset-0 transition-colors cursor-pointer accent-[#2E8B82]" type="checkbox">
<span class="font-body-md text-body-md text-text-muted leading-snug">
            Make profile public to search by default
          </span>
</label>
</div>
<div class="pt-2">
<button class="w-full h-[38px] bg-[#2E8B82] hover:bg-[#349A90] active:bg-[#27756E] text-text-primary font-label-md text-label-md rounded-lg flex items-center justify-center gap-2 transition-all shadow-sm" id="submit-btn" type="submit">
<span class="">Create Account</span>
<span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-space-md text-center relative z-10">
<button class="font-body-md text-body-md text-text-muted hover:text-text-primary transition-colors" id="toggle-auth-state" onclick="toggleMode()" type="button">
        Already have an account? <span class="text-primary-fixed-dim font-label-md underline underline-offset-4">Sign in here</span>
</button>
</div>

</div>

<script>
    let currentMode = 'register';

    function setMode(mode) {
      currentMode = mode;
      const tabSignIn = document.getElementById('tab-signin');
      const tabRegister = document.getElementById('tab-register');
      const fieldName = document.getElementById('field-name');
      const fieldAvailability = document.getElementById('field-availability');
      const fieldCheckbox = document.getElementById('field-checkbox');
      const forgotPasswordLink = document.getElementById('forgot-password-link');
      const submitBtn = document.getElementById('submit-btn');
      const toggleAuthState = document.getElementById('toggle-auth-state');

      if (mode === 'signin') {
        tabSignIn.className = 'py-2 text-center rounded-lg font-label-md text-label-md transition-all bg-surface-elevated text-text-primary shadow-sm';
        tabRegister.className = 'py-2 text-center rounded-lg font-label-md text-label-md transition-all text-text-muted hover:text-text-secondary';
        
        fieldName.classList.add('hidden');
        fieldAvailability.classList.add('hidden');
        fieldCheckbox.classList.add('hidden');
        forgotPasswordLink.classList.remove('hidden');

        submitBtn.innerHTML = '<span>Sign In</span><span class="material-symbols-outlined text-[16px]">login</span>';
        toggleAuthState.innerHTML = 'Don\'t have an account yet? <span class="text-primary-fixed-dim font-label-md underline underline-offset-4">Register here</span>';
      } else {
        tabRegister.className = 'py-2 text-center rounded-lg font-label-md text-label-md transition-all bg-surface-elevated text-text-primary shadow-sm';
        tabSignIn.className = 'py-2 text-center rounded-lg font-label-md text-label-md transition-all text-text-muted hover:text-text-secondary';
        
        fieldName.classList.remove('hidden');
        fieldAvailability.classList.remove('hidden');
        fieldCheckbox.classList.remove('hidden');
        forgotPasswordLink.classList.add('hidden');

        submitBtn.innerHTML = '<span>Create Account</span><span class="material-symbols-outlined text-[16px]">arrow_forward</span>';
        toggleAuthState.innerHTML = 'Already have an account? <span class="text-primary-fixed-dim font-label-md underline underline-offset-4">Sign in here</span>';
      }
    }

    function toggleMode() {
      setMode(currentMode === 'register' ? 'signin' : 'register');
    }

    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const icon = document.getElementById('password-toggle-icon');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        passwordInput.type = 'password';
        icon.textContent = 'visibility';
      }
    }

    function togglePill(button) {
      const isActive = button.classList.contains('active');
      if (isActive) {
        button.classList.remove('active', 'bg-badge-wanted-bg', 'text-primary-fixed-dim');
        button.classList.add('bg-surface-base', 'text-text-secondary');
      } else {
        button.classList.add('active', 'bg-badge-wanted-bg', 'text-primary-fixed-dim');
        button.classList.remove('bg-surface-base', 'text-text-secondary');
      }
    }
  </script>
</div></main></body></html>
